[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daehn"
version = "2.0.0"
description = "Differential-algebraic neural modeling with hard constraint projections in JAX"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["ohagi[export]>=1.0.0,<2.0.0", "purin>=1.0.0,<2.0.0"]

license = "Apache-2.0"
license-files = ["LICENSE*", "NOTICE"]
authors = [{name = "SOULS-TAMU contributors"}]
keywords = ["jax", "constrained-learning", "differentiable-optimization"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Documentation = "https://dae-hardnet.readthedocs.io/en/latest/"
Homepage = "https://github.com/SOULS-TAMU/dae-hardnet/tree/main"
Repository = "https://github.com/SOULS-TAMU/dae-hardnet"
Issues = "https://github.com/SOULS-TAMU/dae-hardnet/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "build", "ruff", "osqp", "absl-py", "flatbuffers"]
docs = ["Sphinx>=8.2,<9", "sphinx-rtd-theme>=3.1,<4", "myst-parser>=4,<5"]
plotting = ["matplotlib>=3.8"]
export = ["absl-py", "flatbuffers"]
cuda12 = ["jax[cuda12]>=0.4.30"]

[tool.setuptools.packages.find]
where = ["src"]




[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["optional: Flax and Orbax integration", "coverage: extended numerical and workflow contracts"]

[tool.coverage.run]
branch = true
source = ["daehn"]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
